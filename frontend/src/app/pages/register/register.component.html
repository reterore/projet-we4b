<div class="container mt-5">
  <div class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
    <h2 class="text-center mb-4">Créer un compte</h2>

    <!-- Message global -->
    <div *ngIf="message" class="alert" [ngClass]="{
      'alert-success': messageType === 'success',
      'alert-danger': messageType === 'error'
    }">
      {{ message }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">

      <!-- Prénom -->
      <div class="mb-3">
        <label for="name" class="form-label">Prénom</label>
        <input id="name" type="text" class="form-control" formControlName="name">
        <div class="text-danger" *ngIf="registerForm.get('name')?.invalid && registerForm.get('name')?.touched">
          Le prénom est requis.
        </div>
      </div>

      <!-- Nom -->
      <div class="mb-3">
        <label for="surname" class="form-label">Nom</label>
        <input id="surname" type="text" class="form-control" formControlName="surname">
        <div class="text-danger" *ngIf="registerForm.get('surname')?.invalid && registerForm.get('surname')?.touched">
          Le nom est requis.
        </div>
      </div>


      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Adresse email</label>
        <input id="email" type="email" class="form-control" formControlName="email">
        <div class="text-danger" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Adresse email invalide.
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input id="password" type="password" class="form-control" formControlName="password">
        <div class="text-danger" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Le mot de passe est requis (6 caractères minimum).
        </div>
      </div>

      <!-- Confirmer le mot de passe -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
        <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword">

        <!-- Erreur champ vide -->
        <div class="text-danger" *ngIf="registerForm.get('confirmPassword')?.invalid && registerForm.get('confirmPassword')?.touched">
          La confirmation est requise.
        </div>

        <!-- Erreur si les mots de passe ne correspondent pas -->
        <div class="text-danger" *ngIf="registerForm.errors?.['passwordMismatch'] && (registerForm.get('confirmPassword')?.touched || registerForm.get('password')?.touched)">
          Les mots de passe ne correspondent pas.
        </div>
      </div>

      <!-- Rôle -->
      <div class="mb-3">
        <label for="role" class="form-label">Rôle</label>
        <select id="role" class="form-select" formControlName="role">
          <option value="" disabled>-- Sélectionner un rôle --</option>
          <option value="student">Étudiant</option>
          <option value="teacher">Professeur</option>
        </select>
        <div class="text-danger" *ngIf="registerForm.get('role')?.invalid && registerForm.get('role')?.touched">
          Le rôle est requis.
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100">Créer le compte</button>
    </form>

    <div class="text-center mt-3">
      <span>Déjà inscrit ? </span>
      <a routerLink="/login">Se connecter</a>
    </div>
  </div>
</div>
