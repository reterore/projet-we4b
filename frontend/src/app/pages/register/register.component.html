<div class="container mt-5">
  <div class="card p-4 shadow-sm mx-auto" style="max-width: 500px;">
    <h2 class="text-center mb-4">Créer un compte</h2>

    <!-- Message global -->
    <div *ngIf="message" class="alert" [ngClass]="{
      'alert-success': messageType === 'success',
      'alert-danger': messageType === 'error'
    }">
      {{ message }}
    </div>

    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <!-- Prénom -->
      <div class="mb-3">
        <label for="prenom" class="form-label">Prénom</label>
        <input id="prenom" type="text" class="form-control" formControlName="prenom">
        <div class="text-danger" *ngIf="registerForm.get('prenom')?.invalid && registerForm.get('prenom')?.touched">
          Le prénom est requis.
        </div>
      </div>

      <!-- Nom -->
      <div class="mb-3">
        <label for="nom" class="form-label">Nom</label>
        <input id="nom" type="text" class="form-control" formControlName="nom">
        <div class="text-danger" *ngIf="registerForm.get('nom')?.invalid && registerForm.get('nom')?.touched">
          Le nom est requis.
        </div>
      </div>

      <!-- Email -->
      <div class="mb-3">
        <label for="email" class="form-label">Adresse email</label>
        <input id="email" type="email" class="form-control" formControlName="email">
        <div class="text-danger" *ngIf="registerForm.get('email')?.invalid && registerForm.get('email')?.touched">
          Entrez une adresse email valide.
        </div>
      </div>

      <!-- Mot de passe -->
      <div class="mb-3">
        <label for="password" class="form-label">Mot de passe</label>
        <input id="password" type="password" class="form-control" formControlName="password">
        <div class="text-danger" *ngIf="registerForm.get('password')?.invalid && registerForm.get('password')?.touched">
          Le mot de passe est requis (min. 6 caractères).
        </div>
      </div>

      <!-- Confirmation mot de passe -->
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
        <input id="confirmPassword" type="password" class="form-control" formControlName="confirmPassword">
        <div class="text-danger" *ngIf="registerForm.hasError('passwordMismatch') && registerForm.get('confirmPassword')?.touched">
          Les mots de passe ne correspondent pas.
        </div>
      </div>

      <!-- Rôle -->
      <div class="mb-3">
        <label for="role" class="form-label">Rôle</label>
        <select id="role" class="form-select" formControlName="role">
          <option value="student">Étudiant</option>
          <option value="teacher">Enseignant</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100" [disabled]="registerForm.invalid">
        S'inscrire
      </button>
    </form>

    <div class="text-center mt-3">
      <span>Déjà inscrit ? </span>
      <a routerLink="/login">Se connecter</a>
    </div>
  </div>
</div>
