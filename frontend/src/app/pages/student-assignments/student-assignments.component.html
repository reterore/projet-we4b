<div class="container mt-4">
  <div class="d-flex justify-content-end my-3">
    <button class="btn btn-outline-secondary" (click)="goToDashboard()">Revenir au menu</button>
  </div>

  <h3 class="mb-4">📘 Mes Résultats</h3>

  <div *ngIf="groupedSubmissions.length === 0" class="text-center mt-5">
    <p>Aucun devoir trouvé</p>
  </div>

  <div *ngFor="let group of groupedSubmissions" class="mb-5">
    <h4 class="mb-3 text-primary border-bottom pb-1">{{ group.courseTitle }}</h4>
    <table class="table table-hover table-bordered shadow-sm">
      <thead class="table-light">
      <tr>
        <th>Devoir</th>
        <th>Commentaire</th>
        <th>Note</th>
      </tr>
      </thead>
      <tbody>
      <tr *ngFor="let s of group.submissions">
        <td>{{ s.assignmentTitle }}</td>
        <td>{{ s.comment || 'Aucun commentaire' }}</td>
        <td>
          <span *ngIf="s.grade !== null">{{ s.grade }}/20</span>
          <span *ngIf="s.grade === null" class="text-muted">Non évalué</span>
        </td>
      </tr>
      <tr class="table-secondary fw-bold">
        <td colspan="2">Moyenne du cours</td>
        <td>
          <span *ngIf="group.average !== null">{{ group.average }}/20</span>
          <span *ngIf="group.average === null">Non disponible</span>
        </td>
      </tr>
      </tbody>
    </table>
  </div>
</div>
