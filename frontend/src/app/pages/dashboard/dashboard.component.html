<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard étudiant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .sidebar {
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      background-color: #343a40;
      padding-top: 60px;
    }
    .sidebar a {
      color: #ddd;
      padding: 15px;
      display: block;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
      color: #fff;
    }
    .main-content {
      margin-left: 240px;
      padding: 20px;
    }
  </style>
</head>
<body>

<!-- Top navbar -->
<nav class="navbar navbar-dark bg-dark fixed-top">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">🎓 MonEspace</a>
    <div class="dropdown">
      <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
        Mon compte
      </button>
      <ul class="dropdown-menu dropdown-menu-end">
        <li><a class="dropdown-item" href="#">Profil</a></li>
        <li><a class="dropdown-item" href="#">Paramètres</a></li>
        <li><hr class="dropdown-divider"></li>
        <li><a class="dropdown-item text-danger" href="#">Déconnexion</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Sidebar -->
<div class="sidebar">
  <a href="#">🏠 Accueil</a>
  <a href="#">📚 Mes cours</a>
  <a href="#">📝 Mes devoirs</a>
  <a href="#">📊 Mes notes</a>
  <a href="#">📨 Messages</a>
</div>

<!-- Main content -->
<div class="main-content">
  <h2 class="mb-4"><br><br>Bienvenue, {{ user?.prenom }} {{ user?.nom }} 👋</h2>

  <div *ngIf="courses.length === 0; else coursList">
    <div class="alert alert-warning">
      Aucun cours disponible pour le moment.
    </div>
  </div>

  <ng-template #coursList>
    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
      <div class="col" *ngFor="let course of courses">
        <div class="card h-100 shadow-sm">
          <div class="card-body">
            <h5 class="card-title">{{ course.title }}</h5>
            <p class="card-text">{{ course.description }}</p>
            <a [routerLink]="['/courses', course._id]" class="btn btn-outline-primary">Accéder</a>
          </div>
        </div>
      </div>
    </div>
  </ng-template>
</div>



<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
