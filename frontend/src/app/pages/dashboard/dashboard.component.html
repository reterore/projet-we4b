<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Dashboard étudiant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8f9fa;
    }
    .sidebar {
      height: 100vh;
      position: fixed;
      top: 0;
      left: 0;
      width: 240px;
      background-color: #343a40;
      padding-top: 60px;
    }
    .sidebar a {
      color: #ddd;
      padding: 15px;
      display: block;
      text-decoration: none;
    }
    .sidebar a:hover {
      background-color: #495057;
      color: #fff;
    }
    .main-content {
      margin-left: 240px;
      padding: 20px;
    }
  </style>
</head>
<body>


<!-- Sidebar -->
<div class="sidebar">
  <a routerLink="/dashboard">🏠 Accueil</a>
  <a routerLink="/select-courses">📚 Cours</a>

  <!-- Menu spécifique aux étudiants -->
  <ng-container *ngIf="!isProf">
    <a href="#">📝 Mes devoirs</a>
    <a href="#">📊 Mes notes</a>
  </ng-container>

  <!-- Menu spécifique aux professeurs -->
  <ng-container *ngIf="isProf">
    <a routerLink="/user-list">👥 Utilisateurs</a>
  </ng-container>

  <a href="#">📨 Messages</a>
</div>


<!-- Main content -->
<div class="main-content">
  <div class="container-fluid">
    <h2 class="mb-4"><br><br>Bienvenue {{ user?.surname }} {{ user?.name }} </h2>

    <!-- Bouton de création visible uniquement pour les profs -->
    <div class="mb-3" *ngIf="isProf">
      <a class="btn btn-success" routerLink="/new-course">➕ Nouveau cours</a>
    </div>

    <div *ngIf="courses.length === 0; else coursList">
      <div class="alert alert-warning">
        Aucun cours disponible pour le moment.
      </div>
    </div>

    <ng-template #coursList>
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col" *ngFor="let course of courses">
          <div class="card h-100 shadow-sm">
            <div class="card-body">
              <h5 class="card-title">{{ course.title }}</h5>
              <p class="card-text">{{ course.description }}</p>
              <a [routerLink]="['/courses', course._id]" class="btn btn-outline-primary">Accéder</a>
              <a
                *ngIf="isProf"
                class="btn btn-outline-secondary ms-2"
                [routerLink]="['/edit-course', course._id]"
              >
                Modifier
              </a>
            </div>
          </div>
        </div>
      </div>
    </ng-template>
  </div>
</div>
</body>
</html>
