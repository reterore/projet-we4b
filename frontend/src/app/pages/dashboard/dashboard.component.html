<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Tableau de bord</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">Mon Dashboard</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
  </div>
</nav>

<!-- Container principal -->
<div class="container mt-4">
  <h2 class="mb-4">Bienvenue sur votre tableau de bord</h2>

  <!-- Ligne de cartes -->
  <div class="row g-4">
    <div class="col-md-4">
      <div class="card text-white bg-success h-100">
        <div class="card-body">
          <h5 class="card-title">Statistique A</h5>
          <p class="card-text">Valeur : 123</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-warning h-100">
        <div class="card-body">
          <h5 class="card-title">Statistique B</h5>
          <p class="card-text">Valeur : 456</p>
        </div>
      </div>
    </div>
    <div class="col-md-4">
      <div class="card text-white bg-danger h-100">
        <div class="card-body">
          <h5 class="card-title">Statistique C</h5>
          <p class="card-text">Valeur : 789</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Section tableau -->
  <div class="mt-5">
    <h4>Dernières entrées</h4>
    <table class="table table-striped">
      <thead class="table-dark">
      <tr>
        <th scope="col">#</th>
        <th scope="col">Nom</th>
        <th scope="col">Date</th>
        <th scope="col">Statut</th>
      </tr>
      </thead>
      <tbody>
      <tr>
        <th scope="row">1</th>
        <td>Entrée 1</td>
        <td>2025-06-05</td>
        <td><span class="badge bg-success">Validé</span></td>
      </tr>
      <tr>
        <th scope="row">2</th>
        <td>Entrée 2</td>
        <td>2025-06-04</td>
        <td><span class="badge bg-warning">En attente</span></td>
      </tr>
      <tr>
        <th scope="row">3</th>
        <td>Entrée 3</td>
        <td>2025-06-03</td>
        <td><span class="badge bg-danger">Rejeté</span></td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
