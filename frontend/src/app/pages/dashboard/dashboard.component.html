<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Liste des cours</h2>
    <button class="btn btn-success" routerLink="/select-courses">Choisir ses cours</button>
  </div>

  <table class="table table-striped table-hover align-middle">
    <thead class="table-dark">
    <tr>
      <th>#</th>
      <th>Titre</th>
      <th>Description</th>
      <th>Professeur</th>
      <th>Actions</th>
    </tr>
    </thead>
    <tbody>
    <tr *ngIf="courses.length === 0">
      <td colspan="5" class="text-center text-muted">Aucun cours trouvé.</td>
    </tr>
    <tr *ngFor="let course of courses; let i = index">
      <td>{{ i + 1 }}</td>
      <td>{{ course.title }}</td>
      <td>{{ course.description }}</td>
      <td>{{ course.teacherId }}</td>
      <td>
        <button class="btn btn-sm btn-warning me-2" (click)="editCourse(course._id!)">Modifier</button>
        <button class="btn btn-sm btn-danger" (click)="deleteCourse(course._id!)">Supprimer</button>

      </td>
    </tr>
    </tbody>
  </table>
</div>
