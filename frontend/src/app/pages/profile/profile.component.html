<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-dark text-white">
          <h4 class="mb-0">👤 Mon Profil</h4>
        </div>
        <div class="card-body">
          <div *ngIf="user; else loading">
            <div class="mb-3">
              <label class="form-label fw-bold">Prénom :</label>
              <p class="form-control-plaintext">{{ user.surname }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Nom :</label>
              <p class="form-control-plaintext">{{ user.name }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Email :</label>
              <p class="form-control-plaintext">{{ user.email }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Rôle :</label>
              <span class="badge bg-primary text-uppercase">{{ user.role }}</span>
            </div>
          </div>
          <ng-template #loading>
            <div class="text-center text-muted">
              Chargement du profil...
            </div>
          </ng-template>
        </div>
        <div class="card-footer text-end">
          <a routerLink="/dashboard" class="btn btn-secondary">Retour</a>
          <!-- futur bouton Modifier -->
          <!-- <button class="btn btn-primary ms-2">Modifier</button> -->
        </div>
      </div>
    </div>
  </div>
</div>
