<div class="container mt-5">
  <h2>Mon Profil</h2>
  <div *ngIf="user" class="card p-4 shadow-sm">
    <p><strong>Nom :</strong> {{ user.name }}</p>
    <p><strong>Prénom :</strong> {{ user.surname }}</p>
    <p><strong>Email :</strong> {{ user.email }}</p>
    <p><strong>Rôle :</strong> {{ user.role }}</p>
  </div>
</div>
