<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow-lg border-0 rounded-3">
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
          <h4 class="mb-0">👤 Mon Profil</h4>
          <button *ngIf="!editMode" class="btn btn-outline-light btn-sm" (click)="editMode = true">🖊️ Modifier</button>
        </div>
        <div class="card-body">
          <div *ngIf="!editMode && user; else editForm">
            <div class="mb-3">
              <label class="form-label fw-bold">Prénom :</label>
              <p class="form-control-plaintext">{{ user.surname }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Nom :</label>
              <p class="form-control-plaintext">{{ user.name }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Email :</label>
              <p class="form-control-plaintext">{{ user.email }}</p>
            </div>
            <div class="mb-3">
              <label class="form-label fw-bold">Rôle :</label>
              <span class="badge bg-primary text-uppercase">{{ user.role }}</span>
            </div>
          </div>

          <!-- Formulaire de modification -->
          <ng-template #editForm>
            <form (ngSubmit)="saveChanges()">
              <div class="mb-3">
                <label class="form-label fw-bold">Prénom</label>
                <input type="text" class="form-control" [(ngModel)]="editedUser.surname" name="surname" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Nom</label>
                <input type="text" class="form-control" [(ngModel)]="editedUser.name" name="name" required>
              </div>
              <div class="mb-3">
                <label class="form-label fw-bold">Email</label>
                <input type="email" class="form-control" [(ngModel)]="editedUser.email" name="email" required>
              </div>

              <div class="d-flex justify-content-end">
                <button type="button" class="btn btn-secondary me-2" (click)="editMode = false">Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
              </div>
            </form>
          </ng-template>
        </div>
        <div class="card-footer text-end">
          <a routerLink="/dashboard" class="btn btn-outline-secondary">Retour</a>
        </div>
      </div>
    </div>
  </div>
</div>
