<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-8">
      <div class="card shadow border-0 rounded-4">
        <!-- En-tête -->
        <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center px-4 py-3">
          <h4 class="mb-0">Mon Profil</h4>
          <button
            *ngIf="!editMode"
            class="btn btn-outline-light btn-sm"
            aria-label="Modifier le profil"
            (click)="editMode = true"
          >
            Modifier
          </button>
        </div>

        <!-- Corps -->
        <div class="card-body px-4 py-4">
          <!-- Mode lecture -->
          <div *ngIf="!editMode && user; else editForm">
            <div class="mb-4">
              <label class="form-label fw-semibold">Prénom</label>
              <div class="form-control-plaintext border rounded px-3 py-2 bg-light">{{ user.surname }}</div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Nom</label>
              <div class="form-control-plaintext border rounded px-3 py-2 bg-light">{{ user.name }}</div>
            </div>
            <div class="mb-4">
              <label class="form-label fw-semibold">Email</label>
              <div class="form-control-plaintext border rounded px-3 py-2 bg-light">{{ user.email }}</div>
            </div>
            <div class="mb-3">
              <label class="form-label fw-semibold">Rôle</label>
              <br>
              <span class="badge bg-primary text-uppercase px-3 py-2">{{ user.role }}</span>
            </div>
          </div>

          <!-- Formulaire -->
          <ng-template #editForm>
            <form (ngSubmit)="saveChanges()" novalidate>
              <div class="mb-3">
                <label class="form-label fw-semibold">Prénom</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="editedUser.surname"
                  name="surname"
                  placeholder="Entrez votre prénom"
                  required
                >
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Nom</label>
                <input
                  type="text"
                  class="form-control"
                  [(ngModel)]="editedUser.name"
                  name="name"
                  placeholder="Entrez votre nom"
                  required
                >
              </div>
              <div class="mb-3">
                <label class="form-label fw-semibold">Email</label>
                <input
                  type="email"
                  class="form-control"
                  [(ngModel)]="editedUser.email"
                  name="email"
                  placeholder="exemple@domaine.com"
                  required
                >
              </div>

              <div class="d-flex justify-content-end gap-2 mt-4">
                <button type="button" class="btn btn-outline-secondary" (click)="editMode = false">Annuler</button>
                <button type="submit" class="btn btn-primary">Enregistrer</button>
              </div>
            </form>
          </ng-template>
        </div>

        <!-- Pied de carte -->
        <div class="card-footer bg-white text-end px-4 py-3 border-0">
          <a routerLink="/dashboard" class="btn btn-outline-dark">Retour au tableau de bord</a>
        </div>
      </div>
    </div>
  </div>
</div>
