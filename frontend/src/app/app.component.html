<router-outlet><!-- app.component.html -->
  <!-- Navbar uniquement si on n’est pas sur /login ou /register -->
  <nav *ngIf="shouldShowNavbar()" class="navbar navbar-dark bg-dark fixed-top">
    <div class="container-fluid">
      <a class="navbar-brand" routerLink="/dashboard">🎓 Moodneuille</a>
      <div class="dropdown">
        <button class="btn btn-outline-light dropdown-toggle" type="button" data-bs-toggle="dropdown">
          Mon compte
        </button>
        <ul class="dropdown-menu dropdown-menu-end">
          <li><a class="dropdown-item" routerLink="/profile">Profil</a></li>
          <li><a class="dropdown-item" href="#">Paramètres</a></li>
          <li><hr class="dropdown-divider"></li>
          <li><a class="dropdown-item text-danger" (click)="logout()">Déconnexion</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Contenu principal avec un padding pour ne pas passer sous la navbar -->
  <div class="main-content pt-5">
    <router-outlet></router-outlet>
  </div>

</router-outlet>
